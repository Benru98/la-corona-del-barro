name: Auditoría funcional en navegador
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/campaign.js'
      - 'app.js'
      - 'index.html'
      - 'home/dispatches.js'
      - '.github/workflows/browser-smoke.yml'
      - 'tests/browser-smoke.mjs'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          command -v google-chrome
      - name: Arrancar servidor web local
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/corona-server.log 2>&1 &
          sleep 2
      - name: Recorrer interfaz, imágenes y controles móviles
        run: node tests/browser-smoke.mjs
      - name: Verificación pública a petición (evita doble navegador por push)
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_URL: https://la-corona-del-barro.pages.dev/
        run: node tests/browser-smoke.mjs

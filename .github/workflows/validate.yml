name: Validar La Corona de Barro
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check app.js
          node --check data/campaign.js
          node --check data/house-state.js
          node --check scripts/audit-house.mjs
          node --check novel/chapters.js
          node --check novel/relationships.js
          node --check novel/editorial-policy.js
          node --check novel/continuity.js
          node --check novel/chapters/index.js
          for file in novel/chapters/*.js; do node --check "$file"; done
          node --check art/catalog.js
          node --check art/portrait-library.js
          node --check scripts/add-chapter.mjs
          node --check scripts/register-art.mjs
          node --check novel/narrative-engine.js
          node --check art-manifest.js
          node --check scripts/save-core.mjs
          node --check scripts/compare-saves.mjs
      - name: Comprobar integridad de datos y recursos
        run: |
          node --test tests/*.test.mjs
          node scripts/audit-house.mjs

name: Validación rápida por archivos modificados
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.webp'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.css'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.webp'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.css'
jobs:
  cambios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y comprobaciones puntuales
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git diff --name-only --diff-filter=ACMRT "$BASE" HEAD > /tmp/corona-changed
          echo "Archivos modificados:"
          cat /tmp/corona-changed
          while IFS= read -r file; do
            case "$file" in
              *.js|*.mjs) if [ -f "$file" ]; then node --check "$file"; fi ;;
              *.json) if [ -f "$file" ]; then node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$file"; fi ;;
            esac
          done < /tmp/corona-changed
          if grep -Eq '^index\.html$|^novel/chapters/.*\.js$' /tmp/corona-changed; then
            node scripts/check-chapter-order.mjs
          fi
          if grep -Eq '^data/(campaign|house-state)\.js$|^novel/relationships\.js$' /tmp/corona-changed; then
            node scripts/audit-house.mjs
          fi
          echo "Comprobación selectiva completada."

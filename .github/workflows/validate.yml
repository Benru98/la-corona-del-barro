name: Validación rápida por archivos modificados
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.webp'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.css'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.webp'
      - '**/*.png'
      - '**/*.svg'
      - '**/*.css'
jobs:
  cambios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight unico de sintaxis y coherencia
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            BASE="$BASE_SHA"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          node scripts/preflight.mjs --base "$BASE"
